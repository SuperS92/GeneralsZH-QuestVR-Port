name: Bug report
description: Report a problem with the Quest port
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include expected behavior and any exact error message.
    validations:
      required: true
  - type: input
    attributes:
      label: Version and headset
      placeholder: App version, Quest model, Quest OS version if known
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Include game mode, map and relevant graphics settings. For multiplayer, include the other client's version and who hosted.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Optional evidence
      description: A screenshot or short log can help. Redact account names, addresses, tokens and private paths. Do not attach retail game files, passwords or signing keys.
